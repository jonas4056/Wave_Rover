rf2o_laser_odometry:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /odom_rf2o
    # De EKF publiceert de TF; rf2o niet, anders zijn er twee bronnen voor odom -> base_footprint.
    publish_tf: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    init_pose_from_topic: ''
    freq: 10.0

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Lidar-odometrie (gecorrigeerd door lidar_odom_fix): snelheden in het frame van de robot.
    # Volgorde: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az
    odom0: /odom_lidar
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    # IMU: alleen de gyroscoop (draaisnelheid). De yaw van de magnetometer is
    # binnenshuis onbetrouwbaar en de versnelling te ruisig voor positie.
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_remove_gravitational_acceleration: false
