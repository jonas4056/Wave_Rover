esp32_bridge:
  ros__parameters:
    port: /dev/esp32
    track_width: 0.17
    # Te kalibreren in fase 2: welke snelheid (m/s) haalt de robot bij wielwaarde 0.5?
    speed_at_max_cmd: 1.25
    max_wheel_cmd: 0.5
    cmd_timeout: 0.5
    imu_rate: 20.0

crsf_joy:
  ros__parameters:
    port: /dev/ttyTHS1
    baud: 420000

# TBS Mambo (TAER, mode 2). Assen = kanaal - 1.
#   kanaal 2 = rechterstick links/rechts  -> draaien
#   kanaal 3 = rechterstick voor/achter   -> vooruit/achteruit
#   kanaal 5 = arm-schakelaar (boven = handmatig rijden)
#   kanaal 6 = snelheid (3 standen)
#   kanaal 8 = vrij voor later
rc_teleop:
  ros__parameters:
    axis_linear: 2
    axis_angular: 1
    axis_arm: 4
    axis_speed: 5
    invert_linear: false
    invert_angular: true
    deadband: 0.05
    max_linear: [0.15, 0.3, 0.6]
    max_angular: [1.0, 2.0, 3.0]

# Hoogste prioriteit wint. De RC-zender gaat altijd voor op dashboard en Nav2.
twist_mux:
  ros__parameters:
    use_stamped: true
    topics:
      rc:
        topic: cmd_vel_rc
        timeout: 0.5
        priority: 100
      dashboard:
        topic: cmd_vel_dashboard
        timeout: 0.5
        priority: 50
      nav:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10
    locks:
      e_stop:
        topic: e_stop
        timeout: 0.0
        priority: 255
