# Modules die op vraag gestart worden via de module-manager.
# Starten:  ros2 service call /modules/lidar/enable std_srvs/srv/SetBool "{data: true}"
# Stoppen:  ros2 service call /modules/lidar/enable std_srvs/srv/SetBool "{data: false}"
# Status:   ros2 topic echo /modules/status
modules:
  lidar:
    description: RPLidar C1 -> /scan
    package: wave_rover_bringup
    launch: lidar.launch.py
    # De C1 blijft draaien als de driver abrupt stopt: motor altijd expliciet stilzetten.
    on_stop: [ros2, run, wave_rover_base, lidar_stop]
  odometry:
    description: Lidar-odometrie + IMU (EKF) -> TF odom -> base_footprint
    package: wave_rover_bringup
    launch: odometry.launch.py
    requires: [lidar]
  slam:
    description: Kaart maken met slam_toolbox -> /map
    package: wave_rover_bringup
    launch: slam.launch.py
    requires: [odometry]
    conflicts: [navigation]
  navigation:
    description: Autonoom navigeren met Nav2 op een opgeslagen kaart (lokalisatie met slam_toolbox)
    package: wave_rover_bringup
    launch: navigation.launch.py
    args:
      map: /home/ubuntu/wave_rover/maps/living_v3
    requires: [odometry]
    conflicts: [slam]
  voice:
    description: Yahboom-spraakmodule (commando's, batterijmeldingen, noodstop)
    package: wave_rover_bringup
    launch: voice.launch.py
