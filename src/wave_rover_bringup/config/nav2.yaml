# Nav2-parameters voor de Wave Rover, gebaseerd op nav2_bringup/params/nav2_params.yaml (Jazzy).
# Aanpassingen: base_footprint als basisframe, /odometry/filtered als odometrie, kleine
# footprint, Regulated Pure Pursuit (0,28 m/s, niet afremmen in bochten) en AMCL afgestemd op odometrie
# zonder encoders. De uitgang gaat naar /cmd_vel_nav2, een ingang van twist_mux.
# Alle snelheidscommando's als TwistStamped (enable_stamped_cmd_vel), zoals twist_mux verwacht.
# Draaisnelheden zijn sinds de draaicorrectie in de bridge (23-10-2026) echte waarden:
# op de plaats draaien aan 1,2 rad/s.
# RPP beperkt de draaiversnelling t.o.v. de GEMETEN draaisnelheid; staat de robot stil, dan
# blijft het commando hangen op max_angular_accel / controller_frequency. Daarom staat die grens
# hoog en doet de velocity_smoother (open loop) het geleidelijk optrekken.
# Korte lookahead (0,45 m) om de route strak te volgen; bochten rijden kan sinds de bridge de
# verhouding links/rechts behoudt en de draaisnelheid gekalibreerd is; pas vanaf ~60 graden
# afwijking eerst op de plaats draaien (rotate_to_heading_min_angle).
# Draaien wordt meteen afgeremd (max_decel -30): anders schiet de robot voorbij de doelrichting
# en pendelt hij heen en weer.
# Lokalisatie met AMCL (standaard sinds 29-10-2026) of slam_toolbox, zie navigation.launch.py.

amcl:
  ros__parameters:
    # Strenger dan de Nav2-standaard: de odometrie (rf2o + gyro, rechtgezette scans) klopt sinds
    # 29-10-2026 tot op 1-2% bij ter plaatse draaien.
    alpha1: 0.15
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.15
    alpha5: 0.1
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 90
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # Omni i.p.v. Differential: het differentiële model splitst een beweging in "draaien naar de
    # rijrichting, rijden, terugdraaien". Onze robot draait niet rond zijn as (schuift 1-2 cm per
    # update): dat werd "90 graden draaien + 1 cm", met veel ruis -> na 2 rondes richting kwijt.
    robot_model_type: nav2_amcl::OmniMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.1
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: scan
    # set_initial_pose en initial_pose komen uit navigation.launch.py (<kaart>.lastpose).
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.3
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.28
      lookahead_dist: 0.45
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.05
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 50.0
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.08
      transform_tolerance: 0.2
    enable_stamped_cmd_vel: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins:
      - voxel_layer
      - floor_layer
      - inflation_layer
      floor_layer:
        # Lage obstakels van de camera (module floor_obstacles). Een eigen laag: de lidar
        # scant erover en mag ze dus niet wissen. Vlak voor de camera ziet ze de vloer niet
        # (blinde zone): daar niets wissen, anders verdwijnt een obstakel als je ernaartoe rijdt.
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # floor_scan wist vrije vloer; floor_points (het geheugen van floor_obstacles, in
        # odom) markeert. Zo komt een obstakel 0,2 s na het leegmaken van de costmap terug.
        observation_sources: floor_scan floor_points
        floor_points:
          topic: /floor_points
          data_type: PointCloud2
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 100.0  # punten in odom: afstand tot de oorsprong van odom
          obstacle_min_range: 0.0
        floor_scan:
          topic: /floor_scan
          data_type: LaserScan
          clearing: true
          marking: false
          inf_is_valid: true
          max_obstacle_height: 2.0
          obstacle_max_range: 1.45
          obstacle_min_range: 0.0
          raytrace_max_range: 1.5
          raytrace_min_range: 0.35
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 6.0
        inflation_radius: 0.25
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
      footprint: '[[0.11, 0.1], [0.11, -0.1], [-0.11, -0.1], [-0.11, 0.1]]'
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - floor_layer
      - inflation_layer
      floor_layer:
        # Lage obstakels van de camera (module floor_obstacles). Een eigen laag: de lidar
        # scant erover en mag ze dus niet wissen. Vlak voor de camera ziet ze de vloer niet
        # (blinde zone): daar niets wissen, anders verdwijnt een obstakel als je ernaartoe rijdt.
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # floor_scan wist vrije vloer; floor_points (het geheugen van floor_obstacles, in
        # odom) markeert. Zo komt een obstakel 0,2 s na het leegmaken van de costmap terug.
        observation_sources: floor_scan floor_points
        floor_points:
          topic: /floor_points
          data_type: PointCloud2
          clearing: false
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 100.0  # punten in odom: afstand tot de oorsprong van odom
          obstacle_min_range: 0.0
        floor_scan:
          topic: /floor_scan
          data_type: LaserScan
          clearing: true
          marking: false
          inf_is_valid: true
          max_obstacle_height: 2.0
          obstacle_max_range: 1.45
          obstacle_min_range: 0.0
          raytrace_max_range: 1.5
          raytrace_min_range: 0.35
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 6.0
        inflation_radius: 0.25
      always_send_full_costmap: true
      footprint: '[[0.11, 0.1], [0.11, -0.1], [-0.11, -0.1], [-0.11, 0.1]]'
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 2.5
    min_rotational_vel: 1.5
    rotational_acc_lim: 6.0
    enable_stamped_cmd_vel: true
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations:
    - AdjustSpeedLimit
    - ReroutingService
    - CollisionMonitor
    ReroutingService:
      plugin: nav2_route::ReroutingService
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      plugin: nav2_route::CollisionMonitor
      max_collision_dist: 3.0
    edge_cost_functions:
    - DistanceScorer
    - CostmapScorer
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    CostmapScorer:
      plugin: nav2_route::CostmapScorer
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.3
    - 0.0
    - 2.5
    min_velocity:
    - -0.3
    - 0.0
    - -2.5
    max_accel:
    - 0.6
    - 0.0
    - 6.0
    max_decel:
    - -0.8
    - 0.0
    - -30.0
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav2
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: scan
      min_height: 0.15
      max_height: 2.0
      enabled: true
    enable_stamped_cmd_vel: true
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_footprint
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins:
    - simple_charging_dock
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
    enable_stamped_cmd_vel: true
loopback_simulator:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    map_frame_id: map
    scan_frame_id: base_scan
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
