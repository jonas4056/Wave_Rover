# Starten op de Jetson:   docker compose up -d --build
# Shell in de container:  docker compose exec ros bash
services:
  ros:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wave_rover:dev
    container_name: wave_rover
    # Host-netwerk: de pc ziet de ROS-topics rechtstreeks.
    network_mode: host
    ipc: host
    # Volledige toegang tot /dev (USB-serieel, UART, camera); eenvoudig voor een hobbyrobot.
    privileged: true
    runtime: nvidia
    # Groep i2c van de Jetson (gid 114), voor de batterijmeting van de UPS op /dev/i2c-7.
    group_add:
      - "114"
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
      # Geen shared memory: na een harde crash blijven er anders oude segmenten in /dev/shm
      # achter, waardoor lokale nodes elkaar niet meer horen.
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ./:/home/ubuntu/wave_rover
      - /dev:/dev
    # Start de robotbasis; na een wijziging: colcon build in de container + docker compose restart.
    command: ros2 launch wave_rover_bringup base.launch.py
    restart: unless-stopped
